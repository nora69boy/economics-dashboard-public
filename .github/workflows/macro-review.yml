name: Public macro integration review
on:
  pull_request:
    paths:
      - scripts/macro_sources_probe.py
      - .github/workflows/macro-review.yml
permissions:
  contents: read
jobs:
  review:
    if: github.repository == 'nora69boy/economics-dashboard-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Check public official source formats
        run: python3 scripts/macro_sources_probe.py
      - name: Preserve public source for reproducible local verification
        run: git archive --format zip HEAD -o macro-source-review/source.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-macro-integration-review
          path: macro-source-review
          retention-days: 1
