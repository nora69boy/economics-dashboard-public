name: Normalize reviewed rights baseline
on:
  push:
    branches: [feat/policy-reaction-board-20260914]
    paths: ['.github/workflows/temp-normalize-baseline.yml']
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - name: Load validated public macro fixture
        run: python3 scripts/macro_fetch.py --snapshot-only
      - name: Preserve baseline formatting and update only reviewed shell hash
        run: |
          python3 scripts/build_release.py
          git show d91bdc51dc6cc9c4dd4882de8906148610eff5d1:data-rights/migration-baseline.json > /tmp/original-baseline.json
          python3 - <<'PY'
          import json,re,sys
          from pathlib import Path
          sys.path.insert(0,'scripts')
          import publication_rights as r
          payload={name:(Path('site')/name).read_bytes() for name in r.TARGETS}
          shell=r.shell_hash(payload)
          p=Path('/tmp/original-baseline.json');text=p.read_text()
          text,n=re.subn(r'("html_shell_sha256": ")[0-9a-f]{64}("[,])',lambda m:m.group(1)+shell+m.group(2),text,count=1)
          assert n==1
          out=Path('data-rights/migration-baseline.json');out.write_text(text)
          digest=r.digest(json.loads(text))
          q=Path('scripts/publication_rights.py');src=q.read_text();src,n=re.subn(r"BASELINE_SHA256 = '[0-9a-f]{64}'","BASELINE_SHA256 = '"+digest+"'",src,count=1);assert n==1;q.write_text(src)
          print('Reviewed shell',shell);print('Baseline digest',digest)
          PY
          git rm .github/workflows/temp-normalize-baseline.yml
      - name: Verify rights baseline and release
        run: |
          python3 scripts/build_release.py
          python3 -m unittest discover -s tests -p test_rights.py -v
          python3 -m unittest discover -s tests -p test_release.py -v
          python3 scripts/check_release.py --check-history --build
      - name: Commit normalized baseline
        run: |
          git config user.name nora69boy
          git config user.email 326280354+nora69boy@users.noreply.github.com
          git add data-rights/migration-baseline.json scripts/publication_rights.py
          git commit -m 'Normalize reviewed shell baseline change'
          git push origin HEAD:feat/policy-reaction-board-20260914
