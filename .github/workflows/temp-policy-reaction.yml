      - name: Rebuild reviewed shell baseline
        run: |
          python3 scripts/build_release.py
          python3 - <<'PY'
          import hashlib,json,re,sys
          from pathlib import Path
          sys.path.insert(0,'scripts')
          import publication_rights as r
          payload={name:(Path('site')/name).read_bytes() for name in r.TARGETS}
          shell=r.shell_hash(payload)
          p=Path('data-rights/migration-baseline.json')
          baseline=json.loads(p.read_text())
          baseline['html_shell_sha256']=shell
          p.write_text(json.dumps(baseline,indent=2)+'\n')
          digest=hashlib.sha256(json.dumps(baseline,sort_keys=True,ensure_ascii=True,separators=(',',':'),allow_nan=False).encode()).hexdigest()
          rights=Path('scripts/publication_rights.py')
          text=rights.read_text()
          text,n=re.subn(r"BASELINE_SHA256 = '[0-9a-f]{64}'", "BASELINE_SHA256 = '"+digest+"'", text, count=1)
          if n!=1: raise SystemExit('baseline constant not found')
          rights.write_text(text)
          print('Reviewed shell:',shell)
          print('Baseline digest:',digest)
          PY
