name: Validate and deploy public research
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # UTC 04/10/16/22 = JST 13/19/01/07, every day.
    - cron: '17 4,10,16,22 * * *'
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      index_sha: ${{ steps.release.outputs.index_sha }}
      refresh_health: ${{ steps.macro.outputs.refresh_health }}
      sec_probe_health: ${{ steps.sec.outputs.sec_probe_health }}
      calendar_probe_health: ${{ steps.calendar.outputs.calendar_probe_health }}
    steps:
      - name: Checkout public sources only
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Isolated legacy regression tests
        run: python3 scripts/run_legacy_tests.py
      - name: Check market-data automation rights
        id: market
        run: python3 scripts/market_refresh_guard.py
      - name: Test SEC filings probe
        run: python3 -m unittest discover -s tests -p test_sec_filings.py -v
      - name: Test official calendar probe
        run: python3 -m unittest discover -s tests -p test_calendar_probe.py -v
      - name: Test calendar completeness publication
        run: python3 -m unittest discover -s tests -p test_calendar_publish.py -v
      - name: Test EIA WTI fallback parser
        run: python3 -m unittest discover -s tests -p test_wti_fallback.py -v
      - name: Probe official SEC filings for tracked US companies
        id: sec
        if: github.event_name != 'pull_request'
        run: python3 scripts/sec_filings.py --probe
      - name: Read published public fixture for pull requests
        if: github.event_name == 'pull_request'
        run: python3 scripts/macro_fetch.py --snapshot-only
      - name: Retrieve six public government histories
        id: macro
        if: github.event_name != 'pull_request'
        run: python3 scripts/macro_fetch.py
      - name: Build reviewed calendar rights fixture
        run: python3 scripts/build_release.py
      - name: Test base publication rights migration
        run: python3 -m unittest discover -s tests -p test_rights.py -v
      - name: Probe BLS BEA and FOMC official calendars
        id: calendar
        if: github.event_name != 'pull_request'
        run: python3 scripts/calendar_probe.py --probe
      - name: Build actual v0.6 release
        run: python3 scripts/build_release.py
      - name: Test actual release and data boundaries
        run: |
          python3 -m unittest discover -s tests -p test_release.py -v
          python3 -m unittest discover -s tests -p test_release_state.py -v
          python3 -m unittest discover -s tests -p test_policy_events.py -v
          python3 -m unittest discover -s tests -p test_systemic_registry.py -v
          python3 -m unittest discover -s tests -p test_relationship_registry.py -v
          python3 -m unittest discover -s tests -p test_company_theme_expansion.py -v
          python3 -m unittest discover -s tests -p test_relevance_scoring.py -v
          python3 -m unittest discover -s tests -p test_executive_overview.py -v
          python3 -m unittest discover -s tests -p test_calendar_rights.py -v
          python3 -m unittest discover -s tests -p test_calendar_publish.py -v
          python3 -m unittest discover -s tests -p test_market_refresh_guard.py -v
          python3 -m unittest discover -s tests -p test_sec_filings.py -v
          python3 -m unittest discover -s tests -p test_calendar_probe.py -v
          python3 -m unittest discover -s tests -p test_browser_retry.py -v
          python3 -m unittest discover -s tests -p test_wti_fallback.py -v
          node --check templates/macro.js
      - name: Finalize Dashboard Health and live market presentation
        run: |
          python3 scripts/dashboard_finalize.py --apply
          python3 scripts/executive_overview.py --apply
          python3 -m unittest discover -s tests -p test_dashboard_finalize.py -v
          python3 -m unittest discover -s tests -p test_systemic_registry.py -v
          python3 -m unittest discover -s tests -p test_relationship_registry.py -v
          python3 -m unittest discover -s tests -p test_company_theme_expansion.py -v
          python3 -m unittest discover -s tests -p test_relevance_scoring.py -v
          python3 -m unittest discover -s tests -p test_executive_overview.py -v
          python3 scripts/phase2_overview.py --apply
          python3 -m unittest discover -s tests -p test_phase2_overview.py -v
          python3 scripts/phase3_feed_health.py --apply
          python3 -m unittest discover -s tests -p test_phase3_feed_health.py -v
          node scripts/browser_release.mjs site/index.html
      - name: Validate allowlisted publication
        id: release
        run: python3 scripts/check_release.py --check-history --build
      - name: Review artifact for reproducibility
        if: github.event_name == 'pull_request'
        run: |
          mkdir release-review
          cp -r .pages-build release-review/site
          git archive --format zip HEAD -o release-review/source.zip
      - name: Upload PR review evidence
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-release-review
          path: release-review
          retention-days: 1
      - name: Upload validated public artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: .pages-build
          retention-days: 1
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Read existing Pages configuration
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - name: Deploy validated artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
      - name: Verify exact HTTPS artifact
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED: ${{ needs.validate.outputs.index_sha }}
        run: |
          case "$SITE_URL" in https://*) ;; *) exit 1 ;; esac
          for attempt in 1 2 3 4 5 6; do
            if curl --proto '=https' --proto-redir '=https' --fail --silent --show-error --location --max-time 25 "$SITE_URL" -o /tmp/site.html; then
              actual=$(sha256sum /tmp/site.html | cut -d ' ' -f 1)
              if [ "$actual" = "$EXPECTED" ]; then echo 'Exact HTTPS artifact verified'; exit 0; fi
            fi
            sleep 10
          done
          exit 1
  refresh-health:
    if: always() && github.event_name != 'pull_request' && needs.validate.result == 'success' && needs.deploy.result == 'success'
    needs: [validate, deploy]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Fail visibly after safe retained data has been published
        env:
          REFRESH_HEALTH: ${{ needs.validate.outputs.refresh_health }}
          SEC_PROBE_HEALTH: ${{ needs.validate.outputs.sec_probe_health }}
          CALENDAR_PROBE_HEALTH: ${{ needs.validate.outputs.calendar_probe_health }}
        run: |
          if [ "$REFRESH_HEALTH" != "fresh" ]; then
            echo '::error::One or more macro sources failed. Validated retained data was published; inspect the refresh summary.'
            exit 1
          fi
          if [ "$SEC_PROBE_HEALTH" = "degraded" ]; then
            echo '::error::SEC filings probe partially failed. No SEC filing data was published; inspect the probe summary.'
            exit 1
          fi
          if [ "$SEC_PROBE_HEALTH" = "source_access_blocked" ]; then
            echo '::warning::SEC blocked/rate-limited the GitHub-hosted runner. Dashboard publication remains valid; SEC filing data remains unpublished.'
          else
            echo 'SEC filing probe retrieved all five tracked companies.'
          fi
          if [ "$CALENDAR_PROBE_HEALTH" = "degraded" ]; then
            echo '::error::Official calendar probe had a parser/data/network failure. Completeness gate retained reviewed families where needed; inspect the probe summary.'
            exit 1
          fi
          if [ "$CALENDAR_PROBE_HEALTH" = "source_access_blocked" ]; then
            echo '::warning::All official calendar sources blocked/rate-limited the GitHub-hosted runner. Reviewed calendar families were retained.'
          elif [ "$CALENDAR_PROBE_HEALTH" = "partial_access_blocked" ]; then
            echo '::warning::Some official calendar sources were blocked while others succeeded. Complete families may publish; incomplete families remain reviewed/static.'
          else
            echo 'Official BLS, BEA and Federal Reserve calendar probe completed.'
          fi
          echo 'Six government histories retrieved successfully. SEC candidates remain rights-pending; economic-calendar publication is protected by family completeness checks.'
