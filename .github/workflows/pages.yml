name: Validate and deploy public research
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout public repository only
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Regression tests
        run: python3 -m unittest discover -s tests -v
      - name: Validate content and commit identities; build allowlisted artifact
        run: python3 scripts/check_site.py --check-history --build
      - name: Upload reviewed artifact only
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: .pages-build
          retention-days: 1
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check existing Pages configuration
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy reviewed artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Verify HTTPS content
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          case "$SITE_URL" in https://*) ;; *) exit 1 ;; esac
          for attempt in 1 2 3 4 5 6; do
            if curl --proto '=https' --proto-redir '=https' --fail --silent --show-error --location --max-time 20 "$SITE_URL" -o /tmp/site.html && grep -q 'Economics Research Dashboard' /tmp/site.html; then
              echo "HTTPS site content verified"
              exit 0
            fi
            sleep 10
          done
          exit 1
